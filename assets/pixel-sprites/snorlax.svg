  <rect x="6" y="2" width="4" height="4" fill="#485868" shape-rendering="crispEdges"/>
  <rect x="22" y="2" width="4" height="4" fill="#485868" shape-rendering="crispEdges"/>
  <!-- Face -->
  <rect x="12" y="6" width="8" height="4" fill="#D8C890" shape-rendering="crispEdges"/>
  <!-- Eyes (closed/sleepy) -->
