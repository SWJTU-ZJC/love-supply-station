<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" fill="transparent" shape-rendering="crispEdges"/>
  <!-- Body -->
  <rect x="4" y="12" width="24" height="18" fill="#485868" shape-rendering="crispEdges"/>
  <rect x="6" y="10" width="20" height="4" fill="#D8C890" shape-rendering="crispEdges"/>
  <!-- Head -->
  <rect x="8" y="4" width="16" height="8" fill="#485868" shape-rendering="crispEdges"/>
