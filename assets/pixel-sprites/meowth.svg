<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" fill="transparent" shape-rendering="crispEdges"/>
  <!-- Body -->
  <rect x="10" y="14" width="12" height="12" fill="#F8E8C0" shape-rendering="crispEdges"/>
  <!-- Head -->
  <rect x="8" y="6" width="16" height="10" fill="#F8E8C0" shape-rendering="crispEdges"/>
  <!-- Ears -->
  <rect x="6" y="0" width="5" height="8" fill="#F8E8C0" shape-rendering="crispEdges"/>
  <rect x="6" y="0" width="2" height="8" fill="#E8C8A0" shape-rendering="crispEdges"/>
  <rect x="21" y="0" width="5" height="8" fill="#F8E8C0" shape-rendering="crispEdges"/>
  <rect x="24" y="0" width="2" height="8" fill="#E8C8A0" shape-rendering="crispEdges"/>
  <!-- Coin on forehead -->
  <rect x="13" y="3" width="6" height="5" fill="#F8D030" shape-rendering="crispEdges"/>
  <rect x="15" y="4" width="2" height="3" fill="#383850" shape-rendering="crispEdges"/>
  <!-- Eyes -->
  <rect x="11" y="9" width="3" height="3" fill="#383850" shape-rendering="crispEdges"/>
  <rect x="18" y="9" width="3" height="3" fill="#383850" shape-rendering="crispEdges"/>
  <!-- Whiskers -->
  <rect x="4" y="10" width="4" height="1" fill="#A08060" shape-rendering="crispEdges"/>
  <rect x="4" y="12" width="4" height="1" fill="#A08060" shape-rendering="crispEdges"/>
  <rect x="24" y="10" width="4" height="1" fill="#A08060" shape-rendering="crispEdges"/>
  <rect x="24" y="12" width="4" height="1" fill="#A08060" shape-rendering="crispEdges"/>
  <!-- Tail -->
  <rect x="24" y="22" width="8" height="2" fill="#E8C8A0" shape-rendering="crispEdges"/>
  <rect x="28" y="18" width="2" height="6" fill="#F8E8C0" shape-rendering="crispEdges"/>
