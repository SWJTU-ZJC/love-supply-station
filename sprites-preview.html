<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>Pokemon Sprites Preview</title>
<style>
  body { background: #383850; color: #f8f8f8; font-family: monospace; padding: 20px; }
  h1 { text-align: center; color: #f8b050; }
  h2 { color: #48DDAA; margin-top: 30px; border-bottom: 2px solid #706880; padding-bottom: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 12px; max-width: 700px; margin: 16px auto; }
  .card { background: #706880; border: 3px solid #484868; padding: 12px; text-align: center; }
  .card img { image-rendering: pixelated; }
  .card p { font-size: 11px; margin: 4px 0; color: #c8c8d8; }
  .card .name { color: #f8b050; font-weight: bold; font-size: 13px; }
  .card .size { color: #8888c8; font-size: 10px; }
</style></head>
<body>
<h1>Pokemon Showdown Sprites</h1>

<h2>Gen 5 Sprites (original size)</h2>
<div class="grid" id="gen5"></div>

<h2>BW Icons (small, for TabBar)</h2>
<div class="grid" id="icons"></div>

<script>
const gen5 = ['pikachu','snorlax','buneary','eevee','meowth','chansey','luvdisc','smeargle','jirachi','togepi','clefairy','munchlax'];
const icons = ['pikachu','snorlax','buneary','eevee','meowth','chansey','luvdisc'];

function makeCards(files, suffix, container) {
  document.getElementById(container).innerHTML = files.map(f =>
    `<div class="card"><img src="/assets/pixel-sprites/${f}-${suffix}.png" onerror="this.parentElement.innerHTML='<p style=color:red>${f} missing</p>'"><p class="name">${f}</p><p class="size">${suffix}</p></div>`
  ).join('');
}
makeCards(gen5, 'gen5', 'gen5');
makeCards(icons, 'icon', 'icons');
</script>
</body></html>
