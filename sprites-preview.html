<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>Pokemon Showdown Sprites</title>
<style>
  body { background: #383850; color: #f8f8f8; font-family: monospace; padding: 20px; }
  h1 { color: #f8b050; text-align: center; }
  a { color: #48DDAA; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px,1fr)); gap: 4px; max-width: 1000px; margin: 10px auto; }
  .card { background: #706880; border: 2px solid #484868; text-align: center; }
  .card img { image-rendering: pixelated; width: 68px; height: 68px; display: block; margin: 0 auto; }
</style></head>
<body>
<h1>Pokemon Gen5 Sprites</h1>
<p style="text-align:center;color:#c8c8d8">Loaded from CDN: <a href="https://play.pokemonshowdown.com/sprites/gen5/">play.pokemonshowdown.com/sprites/gen5/</a></p>
<p style="text-align:center">Browse: <a href="https://play.pokemonshowdown.com/sprites/gen5/?view=dir">Full directory listing</a></p>
<div class="grid" id="grid"></div>
<script>
// Our app's Pokemon
var ours = ['pikachu','snorlax','clefairy','eevee','meowth','chansey','luvdisc','smeargle','jirachi','togepi','buneary','munchlax'];
var base = 'https://play.pokemonshowdown.com/sprites/gen5/';
var grid = document.getElementById('grid');
ours.forEach(function(name) {
  var div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = '<img src="'+base+name+'.png" onerror="this.style.opacity=0.2"><div style="font-size:9px;color:#f8b050;padding:2px">'+name+'</div>';
  grid.appendChild(div);
});
// Also show a few more popular ones
var extra = ['charizard','mewtwo','mew','gengar','dragonite','gyarados','lugia','ho-oh','rayquaza','dialga','palkia','giratina','arceus','zoroark','lucario','greninja','sylveon','mimikyu'];
grid.innerHTML += '<div style="grid-column:1/-1;text-align:center;color:#8888c8;padding:10px">--- More popular Pokemon ---</div>';
extra.forEach(function(name) {
  var div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = '<img src="'+base+name+'.png" onerror="this.style.opacity=0.2"><div style="font-size:9px;color:#f8b050;padding:2px">'+name+'</div>';
  grid.appendChild(div);
});
</script>
</body></html>
