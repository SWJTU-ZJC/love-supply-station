var basePath = '/assets/gen5-sprites/';
var currentFilter = 'all';
var currentSearch = '';

function render(filter) {
  var files = allFiles;
  if (filter === 'base') files = allFiles.filter(function(f) { return !f.includes('-'); });
  if (filter === 'mega') files = allFiles.filter(function(f) { return f.includes('mega'); });
  if (filter === 'shiny') files = allFiles.filter(function(f) { return f.includes('-') && !f.includes('mega'); });
  if (currentSearch) files = files.filter(function(f) { return f.toLowerCase().includes(currentSearch.toLowerCase()); });
  document.getElementById('count').textContent = files.length;
  document.getElementById('grid').innerHTML = files.map(function(f) {
    var name = f.replace('.png','');
    return '<div class="card" onclick="copy(\''+name+'\')" title="'+name+'"><img src="'+basePath+f+'" loading="lazy" onerror="this.style.opacity=0.2"><div class="name">'+name+'</div></div>';
  }).join('');
  document.querySelectorAll('.nav button').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('btn-' + filter).classList.add('active');
}

function filterAll() { currentFilter='all'; render('all'); }
function filterBase() { currentFilter='base'; render('base'); }
function filterMega() { currentFilter='mega'; render('mega'); }
function filterShiny() { currentFilter='shiny'; render('shiny'); }
function doSearch() { currentSearch = document.getElementById('search').value; render(currentFilter); }
function copy(name) { navigator.clipboard.writeText(name).then(function(){ alert('Copied: '+name); }); }

render('all');
</script>
