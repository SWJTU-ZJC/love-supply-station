<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" fill="transparent" shape-rendering="crispEdges"/>
  <!-- Pikachu body -->
  <rect x="10" y="12" width="12" height="14" fill="#F8D030" shape-rendering="crispEdges"/>
  <rect x="8" y="14" width="2" height="6" fill="#F8D030" shape-rendering="crispEdges"/>
  <rect x="22" y="14" width="2" height="6" fill="#F8D030" shape-rendering="crispEdges"/>
  <!-- Head -->
  <rect x="8" y="6" width="16" height="8" fill="#F8D030" shape-rendering="crispEdges"/>
  <!-- Ears -->
  <rect x="6" y="0" width="6" height="8" fill="#F8D030" shape-rendering="crispEdges"/>
  <rect x="6" y="0" width="2" height="8" fill="#C8A020" shape-rendering="crispEdges"/>
  <rect x="20" y="0" width="6" height="8" fill="#F8D030" shape-rendering="crispEdges"/>
  <rect x="24" y="0" width="2" height="8" fill="#C8A020" shape-rendering="crispEdges"/>
  <!-- Cheeks -->
  <rect x="6" y="10" width="4" height="4" fill="#F08030" shape-rendering="crispEdges"/>
  <rect x="22" y="10" width="4" height="4" fill="#F08030" shape-rendering="crispEdges"/>
  <!-- Eyes -->
  <rect x="12" y="8" width="3" height="3" fill="#383850" shape-rendering="crispEdges"/>
  <rect x="17" y="8" width="3" height="3" fill="#383850" shape-rendering="crispEdges"/>
  <!-- Mouth -->
  <rect x="13" y="12" width="6" height="2" fill="#383850" shape-rendering="crispEdges"/>
  <!-- Tail -->
  <rect x="24" y="18" width="8" height="2" fill="#F8D030" shape-rendering="crispEdges"/>
  <rect x="28" y="12" width="2" height="8" fill="#F8D030" shape-rendering="crispEdges"/>
  <rect x="26" y="10" width="4" height="2" fill="#C8A020" shape-rendering="crispEdges"/>
</svg>
